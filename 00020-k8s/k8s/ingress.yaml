apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dummy-express
  labels:
    app: dummy-express
spec:
  ingressClassName: nginx
  rules:
    - host: localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dummy-express
                port:
                  number: 80
