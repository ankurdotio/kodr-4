apiVersion: apps/v1
kind: Deployment
metadata:
  name: dummy-express
  labels:
    app: dummy-express
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dummy-express
  template:
    metadata:
      labels:
        app: dummy-express
    spec:
      containers:
        - name: server
          image: dummy-express:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
