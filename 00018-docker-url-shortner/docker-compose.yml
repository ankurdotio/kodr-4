services:
  mongo:
    image: mongo:8
    command: ["mongod", "--wiredTigerCacheSizeGB", "2.5"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 4G
    volumes:
      - url_db:/data/db
    ports:
      - 8080:27017
    networks:
      - backend

  redis:
    image: redis:latest
    command: ["redis-server", "--maxmemory-policy", "volatile-lru"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 250M
    ports:
      - 8081:6379
    volumes:
      - url_redis:/data
    networks:
      - backend

  server:
    image: url-server
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    ports:
      - 3000:3000
    volumes:
      - ./server/src/:/app/src
    environment:
      - MONGO_URI=${MONGO_URI:? MONGO_UIR is not set}
      - REDIS_URI=${REDIS_URI:? REDIS_URI is not set}
      - URL_STRESS_TEST_MODE=${URL_STRESS_TEST_MODE:? URL_STRESS_TEST_MODE is not set}
    networks:
      - backend
      - frontend

  # Load-testing tools: only started via `docker compose run --rm seed|stress`
  seed:
    image: url-stress
    build: ./server
    profiles: ["stress"]
    command: ["node", "scripts/seed.js"]
    volumes:
      - ./server/scripts:/app/scripts
    environment:
      - MONGO_URI=${MONGO_URI:? MONGO_UIR is not set}
      - SEED_COUNT=${SEED_COUNT:-10000000}
    depends_on:
      - mongo
    networks:
      - backend

  stress:
    image: url-stress
    build: ./server
    profiles: ["stress"]
    command: ["node", "scripts/stress.js"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    volumes:
      - ./server/scripts:/app/scripts
    environment:
      - TARGET_URL=http://server:3000
      - CONNECTIONS=${CONNECTIONS:-100}
      - DURATION=${DURATION:-60}
      - PIPELINING=${PIPELINING:-1}
      - MISS_RATIO=${MISS_RATIO:-0}
      - HOT_IDS=${HOT_IDS:-0}
    depends_on:
      - server
    networks:
      - backend

  client:
    image: url-client
    ports:
      - 5173:5173
    volumes:
      - ./client/src:/app/src
    networks:
      - frontend


volumes:
  url_db:
  url_redis:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge