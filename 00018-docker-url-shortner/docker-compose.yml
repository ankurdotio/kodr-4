services:
  mongo:
    image: mongo:8
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    volumes:
      - url_db:/data/db
    ports:
      - 8080:27017
    networks:
      - backend

  redis:
    image: redis:latest
    command: ["redis-server", "--maxmemory-policy", "volatile-lru"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 250M
    ports:
      - 8081:6379
    volumes:
      - url_redis:/data
    networks:
      - backend

  server:
    image: url-server
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
    ports:
      - 3000:3000
    volumes:
      - ./server/src/:/app/src
    environment:
      - MONGO_URI=${MONGO_URI:? MONGO_UIR is not set}
      - REDIS_URI=${REDIS_URI:? REDIS_URI is not set}
      - URL_STRESS_TEST_MODE=${URL_STRESS_TEST_MODE:? URL_STRESS_TEST_MODE is not set}
    networks:
      - backend
      - frontend

  client:
    image: url-client
    ports:
      - 5173:5173
    volumes:
      - ./client/src:/app/src
    networks:
      - frontend


volumes:
  url_db:
  url_redis:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge