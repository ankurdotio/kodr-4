apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloud-agent-backend
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloud-agent-task
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloud-agent-task-manager
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloud-agent-task-manager
subjects:
  - kind: ServiceAccount
    name: cloud-agent-backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cloud-agent-task-manager
