apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-agent-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-agent-backend
  template:
    metadata:
      labels:
        app: cloud-agent-backend
    spec:
      serviceAccountName: cloud-agent-backend
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: cloud-agent-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: development
            - name: PORT
              value: "3000"
            - name: FRONTEND_ORIGIN
              value: http://localhost:5173
            - name: GITHUB_APP_SLUG
              value: exlantern
            - name: TASK_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: TASK_AGENT_IMAGE
              value: cloud-agent-agent:local
            - name: TASK_WORKSHOP_IMAGE
              value: cloud-agent-workshop:local
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: cloud-agent-github-key
                  key: GITHUB_APP_PRIVATE_KEY
                  optional: true
          envFrom:
            - secretRef:
                name: cloud-agent-backend
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            periodSeconds: 20
