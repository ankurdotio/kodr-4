apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloud-agent
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: cloud-agent-backend
                port:
                  number: 3000
